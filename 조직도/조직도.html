<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=1700" />
    <title>Hubilon 조직도</title>
    <link
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: [
                "Pretendard",
                "Apple SD Gothic Neo",
                "Noto Sans KR",
                "system-ui",
                "sans-serif",
              ],
            },
            colors: {
              navy: {
                900: "#060c20",
                800: "#0a1430",
                700: "#0d1838",
                600: "#122047",
                500: "#15214a",
              },
              dept: {
                "blue":         "#3B82F6",
                "blue-soft":    "#60A5FA",
                "teal":         "#14B8A6",
                "teal-soft":    "#2DD4BF",
                "green":        "#22C55E",
                "green-soft":   "#4ADE80",
                "lime":         "#84CC16",
                "lime-soft":    "#A3E635",
                "orange":       "#F97316",
                "orange-soft":  "#FB923C",
                "magenta":      "#EC4899",
                "magenta-soft": "#F472B6",
              },
            },
            boxShadow: {
              "card": "0 2px 8px rgba(0,0,0,.28)",
              "card-hover": "0 8px 22px rgba(0,0,0,.4)",
              "exec": "0 18px 50px rgba(0,0,0,.35)",
              "pill": "0 8px 20px rgba(0,0,0,.25)",
              "team": "0 4px 12px rgba(0,0,0,.18)",
            },
            backgroundImage: {
              "page": "radial-gradient(ellipse at 50% -10%, #15214a 0%, #0a1430 55%, #060c20 100%)",
              "exec-ceo": "linear-gradient(135deg, #2dd4bf 0%, #3b82f6 100%)",
              "exec-vp":  "linear-gradient(135deg, #5eead4 0%, #38bdf8 100%)",
            },
          },
        },
      };
    </script>
    <style type="text/tailwindcss">
      @layer base {
        html, body {
          @apply bg-page bg-navy-800 text-white font-sans antialiased min-h-screen m-0;
          letter-spacing: -0.01em;
        }
      }
      @layer components {
        /* 부서 컬러 그라데이션 pill — Tailwind arbitrary value 한계 우회 */
        .pill-gradient {
          background-image: linear-gradient(180deg, var(--pill-soft), var(--pill));
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <script
      src="https://unpkg.com/react@18.3.1/umd/react.development.js"
      integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"
      integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"
      integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y"
      crossorigin="anonymous"
    ></script>

    <script src="data.js"></script>
    <script type="text/babel" src="components.jsx"></script>
    <script type="text/babel" src="app.jsx"></script>
  </body>
</html>
